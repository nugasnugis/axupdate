name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run syntax check
        run: python -m py_compile axupdate.py
      - name: Run headless Qt smoke test
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb x11-utils x11-xserver-utils
          XVFB_PID=0
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 3
          python -c "from PyQt6 import QtWidgets; import sys; app=QtWidgets.QApplication(['test']); w=QtWidgets.QMainWindow(); w.setWindowTitle('axupdate test'); w.show(); app.processEvents(); print('GUI available')"
          kill $XVFB_PID
