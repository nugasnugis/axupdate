name: VNC Simulation

on:
  workflow_dispatch:

jobs:
  run-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISPLAY_NUM: :99
      VNC_PORT: 5901
      NOVNC_WEB_PORT: 6080
      NOVNC_WEB_ROOT: /usr/share/novnc/
      PINGGY_PORT: 5901
      APP_CMD: python3 axupdate.py
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pyqt6 python3-pyqt6.qtwebengine python3-pip xvfb x11-utils x11-xserver-utils dbus-x11 novnc websockify x11vnc
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run reusable VNC/Pinggy launcher
        run: |
          chmod +x run_vnc.sh
          DISPLAY_NUM=:99 VNC_PORT=5900 NOVNC_WEB_PORT=6080 APP_CMD="python3 axupdate.py" ./run_vnc.sh
